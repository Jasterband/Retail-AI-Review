openapi: 3.0.3
info:
  title: 药师会零售会议材料检查 API
  description: |
    PE → AI 零售会议材料检查服务。异步提交检查任务，轮询或回调获取结果。

    **权威契约（PE simple）：../README-PE-simple对接.md**
    本 YAML 为机器可读草稿，响应形状可能仍含旧字段（response_mode / rule_results /
    reason_text / photo_type 等）；与对接文档冲突时以对接文档 + app/services/projection.py 为准。
    历史全文 / full 排障：../PE接口文档-v1.8.md。
    主路径：/v1/retail_meeting_checks。
  version: 1.2.0
  contact:
    name: Retail Meeting Check Team

servers:
  - url: https://retail-meeting-check-test.example.com
    description: 测试环境
  - url: https://retail-meeting-check.example.com
    description: 生产环境

tags:
  - name: RetailMeetingChecks
    description: 零售会议材料检查 · 提交与查询

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [RetailMeetingChecks]
      operationId: healthCheck
      summary: 健康检查
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/retail_meeting_checks:
    post:
      tags: [RetailMeetingChecks]
      operationId: createRetailMeetingCheck
      summary: 提交零售会议材料检查
      description: |
        受理一场会议的材料检查任务。请求体与药师会交互 JSON 同构：
        `{ project, meeting, speakers, meetingPhotos }`。
        `task_id` 由 AI 生成并在 202 返回；幂等靠 Idempotency-Key。
        材料传 `fileUrl`（s3:// 或 http(s)://），AI 侧拉取。
      parameters:
        - name: X-Callback-URL
          in: header
          required: false
          schema:
            type: string
            format: uri
          description: 检查完成后回调的 HTTPS URL
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: PE 侧重试键；相同 Key 返回同一 task_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetailMeetingCheckRequest'
            examples:
              microSingle:
                summary: 微型单讲者
                $ref: '#/components/examples/MicroRequest'
      responses:
        '202':
          description: 任务已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailMeetingCheckAccepted'
              example:
                task_id: req-a1b2c3d4e5f64789a0b1c2d3e4f56789
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/retail_meeting_checks/{task_id}:
    get:
      tags: [RetailMeetingChecks]
      operationId: getRetailMeetingCheck
      summary: 查询材料检查结果
      description: |
        返回进行中状态或终态结果（PASS / FAIL / NEED_HUMAN / ERROR）。
        用 query `mode=simple|full` 选择返回详略：simple 给 PE 展示，full 给 AI debug。
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 50
        - name: mode
          in: query
          required: false
          description: 响应模式；默认 simple
          schema:
            type: string
            enum: [simple, full]
            default: simple
      responses:
        '200':
          description: 查询成功（进行中或已完成）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RetailMeetingCheckResponse'
                  - $ref: '#/components/schemas/RetailMeetingCheckRunning'
              examples:
                running:
                  summary: 进行中
                  value:
                    task_id: req-a1b2c3d4e5f64789a0b1c2d3e4f56789
                    meeting_id: "1090"
                    overall_status: null
                pass:
                  summary: 通过
                  $ref: '#/components/examples/PassResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Token
      description: "Authorization: Bearer <YOUR_API_TOKEN>"

  responses:
    BadRequest:
      description: 请求参数非法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: SCHEMA_INVALID
              message: projectType=2（微型）时 meetingType 须为 1 或 2
              retryable: false
    Unauthorized:
      description: 未鉴权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UNAUTHORIZED
              message: 缺少或无效的 Authorization
              retryable: false
    Forbidden:
      description: 无权限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: task_id 不存在
              retryable: false
    RateLimited:
      description: 限流
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMITED
              message: 超过每分钟调用上限
              retryable: true
    InternalError:
      description: 内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 依赖不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: MODEL_UNAVAILABLE
              message: 模型服务暂不可用
              retryable: true

  examples:
    MicroRequest:
      value:
        project:
          projectId: "2"
          projectType: 2
          projectName: 微型药师会
        meeting:
          meetingId: "1090"
          meetingNo: "000090"
          meetingName: 单讲师
          meetingType: 1
          meetingDate: "2026-05-27"
          startTime: "14:00"
          endTime: "14:35"
          chainName: null
          pharmacyName: 老百姓大药房连锁（安徽）有限公司
          meetingLocation: 合肥市老百姓大药房连锁（安徽）有限公司淠河路店
          remark: null
          totalAttendees: 7
        speakers:
          - speakerId: "1"
            identityName: 药师
            storeName: 淠河路店
            speakerName: 示例讲者
            topic: 慢病管理
            serviceMinutes: 30
            photos:
              - photoId: "304"
                photoType: SpeakerTitle
                fileName: speaker.jpg
                fileUrl: s3://pe-meetings/micro/000090/speaker.jpg
        meetingPhotos:
          - photoId: "301"
            photoType: EDM
            fileName: agenda.png
            fileUrl: s3://pe-meetings/micro/000090/agenda.png
          - photoId: "302"
            photoType: EDMDisplay
            fileName: display1.jpg
            fileUrl: s3://pe-meetings/micro/000090/display1.jpg
          - photoId: "303"
            photoType: ProjectIntro
            fileName: intro.jpg
            fileUrl: s3://pe-meetings/micro/000090/intro.jpg
          - photoId: "305"
            photoType: Panorama
            fileName: panorama.jpg
            fileUrl: s3://pe-meetings/micro/000090/panorama.jpg
          - photoId: "306"
            photoType: SignSheet
            fileName: signin.pdf
            fileUrl: s3://pe-meetings/micro/000090/signin.pdf
    PassResponse:
      value:
        task_id: req-a1b2c3d4e5f64789a0b1c2d3e4f56789
        meeting_id: "1002"
        overall_status: PASS
        summary_matched:
          - 日程海报日期/时间/地点与表单一致
          - 台卡四名与讲者名单一致
        summary_failed: []
        photo_results: []

  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
          default: false

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    RetailMeetingCheckAccepted:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
          description: AI 生成；PE 保存后用于轮询/对齐回调

    RetailMeetingCheckRunning:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
        meeting_id:
          type: string
          minLength: 1
          maxLength: 36
        overall_status:
          nullable: true

    PePhoto:
      type: object
      required: [photoId, photoType, fileUrl]
      properties:
        photoId:
          type: string
          minLength: 1
          maxLength: 36
        photoType:
          type: string
          enum:
            - EDM
            - Poster
            - Stand
            - TableCard
            - Manual
            - SpeakerTitle
            - SpeakerLecture
            - Panorama
            - SignSheet
            - EDMDisplay
            - ProjectIntro
        fileUrl:
          type: string
          maxLength: 1000
          pattern: '^(s3|https?)://.+'
        fileName:
          type: string
        photoTypeName:
          type: string

    Speaker:
      type: object
      required: [speakerId, identityName, storeName, speakerName, topic, serviceMinutes]
      properties:
        speakerId:
          type: string
          minLength: 1
          maxLength: 36
        identityName:
          type: string
          maxLength: 10
        storeName:
          type: string
          maxLength: 50
        speakerName:
          type: string
          maxLength: 20
        topic:
          type: string
          maxLength: 50
        serviceMinutes:
          type: integer
          minimum: 1
        lectureFee:
          type: number
          nullable: true
        tax:
          type: number
          nullable: true
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PePhoto'

    Project:
      type: object
      required: [projectId, projectType]
      properties:
        projectId:
          type: string
          minLength: 1
          maxLength: 36
        projectType:
          type: integer
          enum: [1, 2]
          description: 1 大讲堂；2 微型
        projectName:
          type: string
        startDate:
          type: string
        endDate:
          type: string

    Meeting:
      type: object
      required:
        - meetingId
        - meetingNo
        - meetingName
        - meetingType
        - meetingDate
        - startTime
        - endTime
        - meetingLocation
        - totalAttendees
      properties:
        meetingId:
          type: string
          minLength: 1
          maxLength: 36
        meetingNo:
          type: string
          maxLength: 20
        meetingName:
          type: string
          maxLength: 50
        meetingType:
          type: integer
          enum: [0, 1, 2]
          description: 0 大讲堂；1 单讲；2 双讲
        meetingTypeName:
          type: string
          nullable: true
        meetingDate:
          type: string
          format: date
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        endTime:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        durationMinutes:
          type: integer
          nullable: true
        chainName:
          type: string
          nullable: true
          maxLength: 50
          description: 大讲堂必填
        pharmacyName:
          type: string
          nullable: true
          maxLength: 50
          description: 微型必填
        meetingLocation:
          type: string
          maxLength: 200
        remark:
          type: string
          nullable: true
          maxLength: 200
        totalAttendees:
          type: integer
          minimum: 0
        otherCost:
          type: number
          nullable: true

    RetailMeetingCheckRequest:
      type: object
      required: [project, meeting, speakers]
      description: |
        与药师会交互 JSON 同构。task_id 不在请求体，由 AI 生成。
      properties:
        project:
          $ref: '#/components/schemas/Project'
        meeting:
          $ref: '#/components/schemas/Meeting'
        speakers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Speaker'
        meetingPhotos:
          type: array
          items:
            $ref: '#/components/schemas/PePhoto'
        refs:
          type: object
          additionalProperties: true
        options:
          type: object
          additionalProperties: true

    RuleResult:
      type: object
      required: [rule_code, status]
      properties:
        rule_code:
          type: string
        passed:
          type: boolean
          nullable: true
        status:
          type: string
          enum: [PASS, FAIL, SKIP, UNCERTAIN]
        confidence:
          type: number
          nullable: true
        trigger_human:
          type: boolean
          default: false
        reason_code:
          type: string
          nullable: true
        reason_text:
          type: string
          nullable: true
        evidence:
          type: object
          nullable: true
        related_photo_ids:
          type: array
          items:
            type: string

    FailReason:
      type: object
      required: [reason_text]
      properties:
        check:
          type: string
          nullable: true
        reason_code:
          type: string
          nullable: true
        reason_text:
          type: string

    AssetResult:
      type: object
      required: [photo_id, photo_type, photo_status, fail_reasons]
      description: |
        simple：photo_id / photo_type / photo_status / fail_reasons。
        full：另含 checks、ocr、detections、debug 类字段。
      properties:
        photo_id:
          type: string
          minLength: 1
          maxLength: 36
        photo_type:
          type: string
        photo_status:
          type: string
          enum: [PASS, FAIL, UNCERTAIN, ERROR]
        fail_reasons:
          type: array
          items:
            $ref: '#/components/schemas/FailReason'
        detected_type:
          type: string
          nullable: true
        type_match:
          type: boolean
          nullable: true
        clarity_score:
          type: number
          nullable: true
        is_clear:
          type: boolean
          nullable: true
        is_blurry:
          type: boolean
          nullable: true
        checks:
          type: object
          additionalProperties:
            type: boolean
            nullable: true
        uncertain_checks:
          type: array
          items:
            type: string
        ocr_fields:
          type: object
          nullable: true
        ocr_raw:
          type: string
          nullable: true
        detections:
          type: object
          nullable: true
        model_scores:
          type: object
          nullable: true
        image_dup_hit:
          type: boolean
          default: false
          description: 是否与其他会议混用照片（完全一致或近似相似）
        image_dup_kind:
          type: string
          nullable: true
          enum: [exact, similar, null]
        image_dup_score:
          type: number
          nullable: true
        image_dup_ref_meeting_id:
          type: string
          nullable: true
        image_dup_ref_meeting_no:
          type: string
          nullable: true
        topic_reuse_hit:
          type: boolean
          default: false
          description: 仅讲者照：标题是否与历史主题重复
        topic_reuse_ref_meeting_no:
          type: string
          nullable: true
        topic_text_ocr:
          type: string
          nullable: true
        fetch_error:
          $ref: '#/components/schemas/ErrorBody'
          nullable: true

    RetailMeetingCheckResponse:
      type: object
      required:
        - response_mode
        - task_id
        - meeting_id
        - overall_status
        - photo_results
        - rule_results
      properties:
        response_mode:
          type: string
          enum: [simple, full]
        task_id:
          type: string
        meeting_id:
          type: string
          minLength: 1
          maxLength: 36
        job_id:
          type: integer
          nullable: true
        attempt_no:
          type: integer
          nullable: true
        overall_status:
          type: string
          enum: [PASS, FAIL, NEED_HUMAN, ERROR]
        overall_confidence:
          type: number
          nullable: true
        model_version:
          type: string
          nullable: true
        template_pack_version:
          type: string
          nullable: true
        summary_matched:
          type: array
          items:
            type: string
        summary_failed:
          type: array
          items:
            type: string
        need_human_reasons:
          type: array
          items:
            type: string
        error:
          allOf:
            - $ref: '#/components/schemas/ErrorBody'
          nullable: true
        photo_results:
          type: array
          items:
            $ref: '#/components/schemas/AssetResult'
        rule_results:
          type: array
          items:
            $ref: '#/components/schemas/RuleResult'
        debug:
          type: object
          nullable: true
          description: 仅 full
        finished_at:
          type: string
          format: date-time
          nullable: true
        processing_status:
          type: string
          enum: [SUCCEEDED]
          description: 终态时可省略或标 SUCCEEDED
