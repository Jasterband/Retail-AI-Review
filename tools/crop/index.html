<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>四角点裁剪 · 模版 Pack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --panel-2: #232d3a;
      --line: #2e3b4a;
      --text: #e8eef4;
      --muted: #8b9aab;
      --accent: #3d9a7a;
      --accent-2: #e8a54b;
      --danger: #d96b6b;
      --handle: #5ec4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a3a32 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a2438 0%, transparent 50%),
        var(--bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 20, 25, 0.75);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.15rem 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .layout {
      display: grid;
      grid-template-columns: 300px 1fr 280px;
      gap: 0;
      min-height: calc(100vh - 72px);
    }
    @media (max-width: 1100px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: none !important; border-bottom: 1px solid var(--line); }
    }
    aside, .preview-panel {
      background: var(--panel);
      padding: 1rem 1.1rem;
      overflow: auto;
    }
    aside { border-right: 1px solid var(--line); }
    .preview-panel { border-left: 1px solid var(--line); }
    label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0.85rem 0 0.35rem;
    }
    select, input[type="text"], input[type="number"], button, .file-btn {
      width: 100%;
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      padding: 0.55rem 0.7rem;
    }
    select:focus, input:focus { outline: 2px solid rgba(61, 154, 122, 0.45); border-color: var(--accent); }
    button, .file-btn {
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    button:hover, .file-btn:hover { transform: translateY(-1px); }
    button.primary {
      background: var(--accent);
      border-color: transparent;
      color: #06140f;
    }
    button.secondary { background: var(--panel-2); }
    button.ghost {
      background: transparent;
      margin-top: 0.35rem;
    }
    .file-btn { display: inline-block; text-align: center; }
    .file-btn input { display: none; }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.45;
      margin: 0.6rem 0 0;
    }
    .steps {
      display: grid;
      gap: 0.4rem;
      margin: 0.75rem 0 0;
      padding: 0;
      list-style: none;
    }
    .steps li {
      display: flex;
      gap: 0.55rem;
      align-items: flex-start;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .steps b {
      flex: 0 0 1.2rem;
      width: 1.2rem;
      height: 1.2rem;
      border-radius: 999px;
      background: var(--panel-2);
      color: var(--accent-2);
      font-size: 0.7rem;
      display: grid;
      place-items: center;
      margin-top: 0.1rem;
    }
    .canvas-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background:
        linear-gradient(45deg, #151b22 25%, transparent 25%) -8px 0 / 16px 16px,
        linear-gradient(-45deg, #151b22 25%, transparent 25%) -8px 0 / 16px 16px,
        linear-gradient(45deg, transparent 75%, #151b22 75%) 0 0 / 16px 16px,
        linear-gradient(-45deg, transparent 75%, #151b22 75%) 0 0 / 16px 16px,
        #0c1015;
      min-height: 60vh;
    }
    canvas#stage {
      max-width: 100%;
      max-height: calc(100vh - 120px);
      cursor: crosshair;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      border-radius: 4px;
    }
    .status {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.75rem;
      min-height: 1.2em;
      word-break: break-all;
    }
    .status.ok { color: var(--accent); }
    .status.err { color: var(--danger); }
    .preview-panel img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #000;
      display: block;
    }
    .empty {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.5rem 0.5rem;
      text-align: center;
    }
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
    .chip {
      font-size: 0.72rem;
      padding: 0.2rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .chip.on { border-color: var(--handle); color: var(--handle); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>四角点裁剪</h1>
      <p>依次点左上 → 右上 → 右下 → 左下，可拖动微调；保存到 docs/templates/2026Q2/</p>
    </div>
    <div class="chip-row" id="pointChips">
      <span class="chip" data-i="0">1 左上</span>
      <span class="chip" data-i="1">2 右上</span>
      <span class="chip" data-i="2">3 右下</span>
      <span class="chip" data-i="3">4 左下</span>
    </div>
  </header>

  <div class="layout">
    <aside>
      <label>样例图（微型优先）</label>
      <select id="sampleSelect">
        <option value="">— 选择样例 —</option>
      </select>

      <label>或本地上传</label>
      <label class="file-btn">选择图片
        <input type="file" id="fileInput" accept="image/*" />
      </label>

      <label>保存为</label>
      <select id="presetSelect"></select>

      <label>输出尺寸（空=自动）</label>
      <div class="row2">
        <input type="number" id="outW" placeholder="宽" min="32" max="4000" />
        <input type="number" id="outH" placeholder="高" min="32" max="4000" />
      </div>

      <button class="primary" id="btnWarp" type="button">生成预览</button>
      <button class="secondary" id="btnSave" type="button">生成并保存到 Pack</button>
      <button class="ghost" id="btnReset" type="button">清空四点</button>
      <button class="ghost" id="btnDownload" type="button">下载预览图</button>

      <ul class="steps">
        <li><b>1</b><span>选权益照片（建议 000089 / 000090）</span></li>
        <li><b>2</b><span>点四个角包住丝带或日程表</span></li>
        <li><b>3</b><span>选「权益一丝带」或「权益二日程表」保存</span></li>
      </ul>
      <p class="hint">Token 与 Demo 相同（默认 dev-token-change-me）。透视在服务端用 Pillow 完成。</p>
      <div class="status" id="status"></div>
    </aside>

    <div class="canvas-wrap">
      <canvas id="stage" width="800" height="500"></canvas>
    </div>

    <div class="preview-panel">
      <label>透视结果</label>
      <div id="previewBox" class="empty">四点齐全后点「生成预览」</div>
      <div class="status" id="savePath"></div>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "pe_crop_token";
    const token = () => localStorage.getItem(TOKEN_KEY) || "dev-token-change-me";

    const canvas = document.getElementById("stage");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const previewBox = document.getElementById("previewBox");
    const savePathEl = document.getElementById("savePath");
    const sampleSelect = document.getElementById("sampleSelect");
    const presetSelect = document.getElementById("presetSelect");

    let img = null;
    let sampleUrl = null;
    let imageBase64 = null;
    let points = []; // image-space {x,y}
    let dragIndex = -1;
    let scale = 1; // canvas display / natural
    let offsetX = 0, offsetY = 0;
    let lastBlobUrl = null;

    function setStatus(msg, kind) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function updateChips() {
      document.querySelectorAll("#pointChips .chip").forEach((el, i) => {
        el.classList.toggle("on", i < points.length);
      });
    }

    async function api(path, opts = {}) {
      const headers = Object.assign(
        { Authorization: "Bearer " + token() },
        opts.headers || {}
      );
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      if (!res.ok) {
        let detail = res.statusText;
        try {
          const j = await res.json();
          detail = j.detail || (j.error && j.error.message) || JSON.stringify(j);
        } catch (_) {
          try { detail = await res.text(); } catch (__) {}
        }
        throw new Error(detail);
      }
      return res;
    }

    async function boot() {
      try {
        const cfg = await fetch("/v1/demo_config").then((r) => r.json());
        if (cfg.default_token) localStorage.setItem(TOKEN_KEY, cfg.default_token);
      } catch (_) {}

      const presets = await api("/v1/crop/presets").then((r) => r.json());
      presetSelect.innerHTML = presets.presets
        .map((p) => `<option value="${p.path}">${p.label} → ${p.path}</option>`)
        .join("");

      const samples = await api("/v1/crop/samples").then((r) => r.json());
      const optGroup = (label, items) => {
        if (!items.length) return "";
        return `<optgroup label="${label}">` +
          items.map((s) => `<option value="${s.url}">${s.label}</option>`).join("") +
          `</optgroup>`;
      };
      sampleSelect.innerHTML =
        `<option value="">— 选择样例 —</option>` +
        optGroup("微型药师", samples.micro) +
        optGroup("药师大讲堂", samples.hall);
      setStatus("就绪");
    }

    function layoutCanvas() {
      if (!img) return;
      const maxW = canvas.parentElement.clientWidth - 32;
      const maxH = window.innerHeight - 120;
      scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      offsetX = 0;
      offsetY = 0;
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!img) {
        ctx.fillStyle = "#8b9aab";
        ctx.font = "14px DM Sans";
        ctx.fillText("请选择或上传图片", 24, 40);
        return;
      }
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      if (points.length) {
        ctx.beginPath();
        points.forEach((p, i) => {
          const x = p.x * scale;
          const y = p.y * scale;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        if (points.length === 4) ctx.closePath();
        ctx.strokeStyle = "rgba(94, 196, 255, 0.95)";
        ctx.lineWidth = 2;
        ctx.stroke();
        if (points.length === 4) {
          ctx.fillStyle = "rgba(94, 196, 255, 0.18)";
          ctx.fill();
        }
      }

      const labels = ["TL", "TR", "BR", "BL"];
      points.forEach((p, i) => {
        const x = p.x * scale;
        const y = p.y * scale;
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#5ec4ff";
        ctx.fill();
        ctx.strokeStyle = "#0f1419";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = "#e8eef4";
        ctx.font = "600 11px JetBrains Mono";
        ctx.fillText(labels[i], x + 10, y - 8);
      });
      updateChips();
    }

    function canvasToImage(cx, cy) {
      return { x: cx / scale, y: cy / scale };
    }

    function hitTest(cx, cy) {
      for (let i = 0; i < points.length; i++) {
        const dx = points[i].x * scale - cx;
        const dy = points[i].y * scale - cy;
        if (dx * dx + dy * dy <= 12 * 12) return i;
      }
      return -1;
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (!img) return;
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
      const hit = hitTest(cx, cy);
      if (hit >= 0) {
        dragIndex = hit;
        canvas.setPointerCapture(e.pointerId);
        return;
      }
      if (points.length < 4) {
        points.push(canvasToImage(cx, cy));
        draw();
        setStatus(`已标 ${points.length}/4 点`);
      }
    });

    canvas.addEventListener("pointermove", (e) => {
      if (dragIndex < 0 || !img) return;
      const rect = canvas.getBoundingClientRect();
      const cx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const cy = (e.clientY - rect.top) * (canvas.height / rect.height);
      const p = canvasToImage(cx, cy);
      p.x = Math.max(0, Math.min(img.naturalWidth, p.x));
      p.y = Math.max(0, Math.min(img.naturalHeight, p.y));
      points[dragIndex] = p;
      draw();
    });

    canvas.addEventListener("pointerup", () => { dragIndex = -1; });
    canvas.addEventListener("pointercancel", () => { dragIndex = -1; });

    function loadFromUrl(url) {
      return new Promise((resolve, reject) => {
        const im = new Image();
        im.crossOrigin = "anonymous";
        im.onload = () => {
          img = im;
          sampleUrl = url;
          imageBase64 = null;
          points = [];
          layoutCanvas();
          setStatus("已加载样例，请点四个角");
          resolve();
        };
        im.onerror = () => reject(new Error("图片加载失败"));
        im.src = url;
      });
    }

    sampleSelect.addEventListener("change", async () => {
      if (!sampleSelect.value) return;
      try {
        await loadFromUrl(sampleSelect.value);
      } catch (e) {
        setStatus(String(e.message || e), "err");
      }
    });

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const im = new Image();
        im.onload = () => {
          img = im;
          sampleUrl = null;
          imageBase64 = reader.result;
          points = [];
          layoutCanvas();
          setStatus("已加载本地图，请点四个角");
        };
        im.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      points = [];
      draw();
      setStatus("已清空四点");
    });

    async function warp(save) {
      if (!img || points.length !== 4) {
        setStatus("请先标满四个点（左上→右上→右下→左下）", "err");
        return;
      }
      const body = {
        points: points.map((p) => ({ x: p.x, y: p.y })),
        format: presetSelect.value.endsWith(".png") ? "png" : "jpeg",
      };
      if (sampleUrl) body.sample_url = sampleUrl;
      else body.image_base64 = imageBase64;

      const w = document.getElementById("outW").value;
      const h = document.getElementById("outH").value;
      if (w) body.out_width = Number(w);
      if (h) body.out_height = Number(h);
      if (save) body.save_as = presetSelect.value;

      setStatus(save ? "保存中…" : "生成中…");
      try {
        const res = await api("/v1/crop/warp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const blob = await res.blob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(blob);
        previewBox.innerHTML = "";
        const im = document.createElement("img");
        im.src = lastBlobUrl;
        im.alt = "crop preview";
        previewBox.appendChild(im);
        const ow = res.headers.get("X-Out-Width");
        const oh = res.headers.get("X-Out-Height");
        const saved = res.headers.get("X-Saved-Path");
        setStatus(`完成 ${ow}×${oh}` + (saved ? "，已写入磁盘" : ""), "ok");
        savePathEl.textContent = saved || "";
        savePathEl.className = "status ok";
      } catch (e) {
        setStatus(String(e.message || e), "err");
      }
    }

    document.getElementById("btnWarp").addEventListener("click", () => warp(false));
    document.getElementById("btnSave").addEventListener("click", () => warp(true));
    document.getElementById("btnDownload").addEventListener("click", () => {
      if (!lastBlobUrl) {
        setStatus("请先生成预览", "err");
        return;
      }
      const a = document.createElement("a");
      a.href = lastBlobUrl;
      a.download = (presetSelect.value.split("/").pop()) || "crop.jpg";
      a.click();
    });

    window.addEventListener("resize", () => { if (img) layoutCanvas(); });
    boot().catch((e) => setStatus(String(e.message || e), "err"));
  </script>
</body>
</html>
